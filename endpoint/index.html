<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <script type="module">
            import init, { login, loginViaToken, execute } from './build/endpoint.js';

            window.callback = null;

            const send = (message) => window.callback?.(JSON.parse(message));
            const sendError = () => window.callback?.({ error: 'an_error_occurred' });

            const sendAccount = async (message) => {
                const account = JSON.parse(message);

                if (account.token) {
                    try {
                        account.token = await sealToken(account.token);
                    } catch {
                        delete account.token;
                    }
                }

                window.callback?.(account);
            };

            window.addEventListener('error', sendError);
            window.addEventListener('unhandledrejection', sendError);

            function requestResult(request) {
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // Token is sealed once more with a key that cannot leave this browser
            async function getBrowserKey() {
                const request = indexedDB.open('endpoint', 1);
                request.onupgradeneeded = () => request.result.createObjectStore('keys');

                const database = await requestResult(request);

                try {
                    let key = await requestResult(database.transaction('keys').objectStore('keys').get('token'));

                    if (!key) {
                        key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

                        await requestResult(database.transaction('keys', 'readwrite').objectStore('keys').put(key, 'token'));
                    }

                    return key;
                } finally {
                    database.close();
                }
            }

            async function sealToken(token) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const sealed = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await getBrowserKey(), new TextEncoder().encode(token));

                const bytes = new Uint8Array(iv.length + sealed.byteLength);
                bytes.set(iv);
                bytes.set(new Uint8Array(sealed), iv.length);

                return btoa(String.fromCharCode(...bytes));
            }

            async function openToken(token) {
                const bytes = Uint8Array.from(atob(token), (char) => char.charCodeAt(0));
                const opened = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, await getBrowserKey(), bytes.subarray(12));

                return new TextDecoder().decode(opened);
            }

            window.load = async function () {
                await init();
            }

            window.destroy = async function () {}

            window.playaAccountLogin = function (server, username, password, remember) {
                if (password.length > 40) {
                    password = password.slice(0, 40);
                }

                login(JSON.stringify({ server, username, password, remember }), sendAccount);
            }

            window.playaAccountLoginViaToken = async function (server, token) {
                let opened;

                try {
                    opened = await openToken(token);
                } catch {
                    window.callback?.({ error: 'endpoint_token_invalid' });
                    return;
                }

                loginViaToken(JSON.stringify({ server, token: opened }), sendAccount);
            }

            window.execute = function (params) {
                execute(JSON.stringify(params), send);
            }
        </script>
    </body>
</html>
