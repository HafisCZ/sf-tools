[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "SFTools simulator engine"
publish = false

[lib]
# Builds a standalone .wasm file
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
